<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Speech to Text</title>
</head>
<body>

    <h1>Speech to Text App</h1>
    <p id="status">Status: Ready</p>

    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>

    <h3>Transcription:</h3>
    <p id="output" style="border: 1px solid #ccc; padding: 10px; min-height: 50px;"></p>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('status');
        const outputBox = document.getElementById('output');

        startBtn.onclick = async () => {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    statusText.innerText = "Uploading and transcribing...";
                    
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('audio', audioBlob);

                    try {
                        const response = await fetch('/api/transcribe', {
                            method: 'POST',
                            body: formData
                        });
                        const resultText = await response.text();
                        outputBox.innerText = resultText;
                        statusText.innerText = "Done!";
                    } catch (err) {
                        outputBox.innerText = "Error: " + err;
                        statusText.innerText = "Failed";
                    }
                };
                mediaRecorder.start();
                statusText.innerText = "Recording... Speak now.";
                startBtn.disabled = true;
                stopBtn.disabled = false;

            } catch (err) {
                alert("Microphone error: " + err);
            }
        };
        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        };
    </script>
</body>
</html>
